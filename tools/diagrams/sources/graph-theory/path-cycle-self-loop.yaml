schema: cp-diagram/v2
type: graph
background: white
directed: false
layout: balanced
node-shape: circle
nodes:
  - {id: 1}
  - {id: 2}
  - {id: 3}
  - {id: 4}
  - {id: 5}
  - {id: 6}
edges:
  - {from: 1, to: 2}
  - {from: 2, to: 3}
  - {from: 3, to: 1}
  - {from: 3, to: 4}
  - {from: 4, to: 5}
  - {from: 5, to: 6}
  - {from: 5, to: 5}
annotations:
  - type: path
    nodes: [1, 2, 3]
    closed: true
    color: red
  - type: path
    nodes: [3, 4, 5, 6]
    color: blue

name: 部署网站

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: 检查并发布
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 判断发布范围
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "content=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi

          if git diff --quiet "$BEFORE" "$REVISION" -- \
            ':(top,glob)notes/**/*.md' \
            ':(top,glob)notes/**/*.quiz.json'; then
            echo "content=false" >> "$GITHUB_OUTPUT"
          else
            echo "content=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BEFORE" "$REVISION" -- \
            ':(top,glob)apps/web/**' \
            ':(top,glob)notes/assets/**' \
            ':(top).github/workflows/deploy.yml'; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 pnpm
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.web == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: 安装 Node.js
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: 安装依赖
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: 恢复正文编译缓存
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.web == 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/.content-cache
          key: handbook-content-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            handbook-content-v2-${{ runner.os }}-

      - name: 检查内容身份
        if: steps.changes.outputs.content == 'true'
        run: pnpm test:content-identity

      - name: 检查搜索规则
        if: steps.changes.outputs.content == 'true'
        run: pnpm test:search

      - name: 部署到 Cloudflare
        if: steps.changes.outputs.web == 'true'
        run: pnpm deploy:web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 发布正文对象
        if: steps.changes.outputs.content == 'true'
        run: pnpm publish:content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
